# Plantilla de Secrets para las 8 tiendas.
#
# Local: guardar como .streamlit/secrets.toml (NO subir al repo).
# Streamlit Cloud: pegar el mismo contenido en Settings > Secrets.
#
# Reemplaza cada shop_domain por el dominio real .myshopify.com y cada token por el
# de la app del CLI instalada en esa tienda (no un custom app del Admin, ver
# ROLLOUT_MULTITIENDA.md seccion 1).
#
# Verifica con:  python diagnostico_multitienda.py

# OJO con la precedencia: la app lee `access_token` ANTES que `admin_access_token`.
# Si dejas el token viejo bajo `access_token`, ese gana y el de cupones se ignora.
# Nunca uses la clave `access_token` para el token de catalogo digital.

# Tienda con dos apps (catalogo digital viejo + app de cupones nueva).
# El bloque `tokens` es solo para el diagnostico: prueba los dos y te dice cual
# ve la Discount Function. Ese es el que despues va en admin_access_token.
[shopify_sites.columbia]
shop_domain = "columbiape.myshopify.com"
admin_access_token = "shpat_APP_CUPONES"
api_version = "2026-04"
compare_at_best_wins_function_handle = "compare-at-best-wins"

[shopify_sites.columbia.tokens]
catalogo_digital = "shpat_TOKEN_VIEJO"

[shopify_sites.columbia.tokens.app_cupones]
admin_access_token = "shpat_APP_CUPONES"
client_id = "CLIENT_ID_DE_LA_APP_DE_CUPONES"

